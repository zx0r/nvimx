[package]
name = "nvimx"
version = "0.1.3"
edition = "2024"
rust-version = "1.96.0"
repository = "https://github.com/zx0r/nvimx"
description = "Fast and flexible Neovim profile manager"
homepage = "https://github.com/zx0r/nvimx"
authors = ["zx0r <admin@zx0r.io>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["nvimx", "neovim", "cli", "profile-manager", "dotfiles"]
exclude = [
    "assets/gif/*",
    "assets/og/*",
    "assets/images/*",
    "prompts/*",
    "brain/*",
    ".github/*",
    "tests/*",
]

[workspace]
members = ["."]

[profile.dev]
# level true/2 is usually overkill, cf. <https://doc.rust-lang.org/cargo/reference/profiles.html#debug>
debug = "limited"
# thin-local LTO is basically free, cf. <https://doc.rust-lang.org/cargo/reference/profiles.html#lto>
lto = false
# this speeds up xz compression etc. significantly. we could
# be more selective about which packages to optimize but :shrug:
package."*" = { opt-level = 2 }

[profile.dist]
inherits = "release"
lto = "fat"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
incremental = false
rpath = false

# [lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }
# unwrap_used = "warn"

[dependencies]
clap_complete = "4.6.11"
anyhow = "1.0.104"
thiserror = "2.0.21"
dirs = "7.0.0"
serde_json = "1.0.154"
toml = "1.1.8"
which = "8.0.6"
chrono = "0.4.45"
semver = "1.0.28"
owo-colors = "4.4.0"
tracing = "0.1.44"
indicatif = "0.18.6"
ureq = { version = "3.5.0", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
rand = "0.10.3"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: {{version}}"
publish = false
